_base: configs/base.yaml

unlearn:
  method: npo_retain
  lr: 2.0e-5
  steps: 400          # pilot showed every run still descending at 200
  beta: 0.1

# Stage 2 of a staged search. Stage 1 (pilot, seed 0 only) swept
# beta [0.05, 0.1, 0.5] x lr [1e-5, 2e-5] and is EXCLUDED from final analysis;
# it exists to locate the viable region on a CPU budget. 5e-5 was never tested
# for NPO because the gradiff sweep showed it destroys the model.
sweep:
  beta: [0.1]
  lr: [2.0e-5]
  seed: [0, 1, 2]